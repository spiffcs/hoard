# XcodeGen spec for the iPhone capture head.
#
# The generated .xcodeproj is a build artifact and is gitignored; this file is
# the source of truth. That matches how build-scan.sh hand-assembles the macOS
# .app rather than carrying an Xcode project — the repo keeps readable, diffable
# inputs and treats Xcode's output as disposable. It also keeps a 3000-line
# pbxproj out of every diff.
#
#   brew install xcodegen
#   make scan-ios
#
# Signing is deliberately not in this file. DEVELOPMENT_TEAM lives in
# Signing.xcconfig, which is gitignored, so a team identifier never lands in the
# repo. build-scan-ios.sh writes a template if it is missing.

name: HoardScan
options:
  bundleIdPrefix: dev.spiffcs.hoard
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

# The shared SwiftPM package. Named for the directory it lives in rather than
# for any one product: the app links four of them.
packages:
  HoardScanPackage:
    path: ../hoard-scan

targets:
  HoardScan:
    type: application
    platform: iOS
    sources:
      - path: Sources
      # The app icon, derived from the macOS helper's .icns by make-icon.swift
      # so both platforms ship the same artwork from one source file.
      - path: Resources
    # ScanKit is deliberately absent: it is the *Mac* end of the link — the
    # translator and its mirror window — and no source here imports it. It was
    # listed until 2026-08-05 and never used, which only surfaced when the
    # package stopped vending it as a product.
    dependencies:
      - package: HoardScanPackage
        product: CardKit
      - package: HoardScanPackage
        product: ScanLink
      - package: HoardScanPackage
        product: ScanWire
    info:
      path: Info.plist
      properties:
        # The variable reference, quoted so xcodegen writes it into the plist
        # verbatim for Xcode to resolve at build time — written as a literal,
        # the build stamp build-scan-ios.sh passes lands in a setting nothing
        # reads, and the phone reports whatever number generation day left
        # here (live: a tuning session ran against "phone=1").
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDisplayName: hoardling
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription:
          Hoardling uses the camera to scan and identify Magic cards.
        # Required from iOS 14 for the Bonjour link to the Mac (stage C). The
        # permission prompt is one-time and cannot be re-offered without
        # deleting the app, so it is declared before it is needed rather than
        # discovered during a session.
        NSLocalNetworkUsageDescription:
          Hoardling sends card reads to the hoard app running on your Mac.
        NSBonjourServices:
          - _hoardscan._tcp
        # The capture log accumulates in Documents/ and is pulled off the device
        # with `devicectl device copy from`. These make the container reachable
        # from the Files app too, so a session's numbers can be recovered by hand
        # when the tooling misbehaves — which it has.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.spiffcs.hoard.scan.ios
        MARKETING_VERSION: "0.1"
        # "0" means an unstamped build — Xcode-GUI builds report phone=0 and
        # say so honestly; build-scan-ios.sh overrides this with its
        # per-build timestamp, which is the number a tuning session trusts.
        CURRENT_PROJECT_VERSION: "0"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig

name: HoardScan
options:
  bundleIdPrefix: dev.spiffcs.hoard
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

packages:
  HoardScanPackage:
    path: ../hoard-scan

targets:
  HoardScan:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    dependencies:
      - package: HoardScanPackage
        product: CardKit
      - package: HoardScanPackage
        product: ScanLink
      - package: HoardScanPackage
        product: ScanWire
    info:
      path: Info.plist
      properties:
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleDisplayName: Hoardling
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription:
          Hoardling uses the camera to scan and identify Magic cards.
        NSLocalNetworkUsageDescription:
          Hoardling sends card reads to the hoard app running on your Mac.
        NSBonjourServices:
          - _hoardscan._tcp
        ITSAppUsesNonExemptEncryption: false
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.spiffcs.hoard.scan.ios
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "0"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    postBuildScripts:
      - name: Strip file-sharing keys (non-Debug)
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        basedOnDependencyAnalysis: false
        script: |
          set -eu
          if [ "${CONFIGURATION}" != "Debug" ]; then
            plist="${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
            for key in UIFileSharingEnabled LSSupportsOpeningDocumentsInPlace; do
              /usr/libexec/PlistBuddy -c "Delete :${key}" "${plist}" 2>/dev/null || true
              if /usr/libexec/PlistBuddy -c "Print :${key}" "${plist}" >/dev/null 2>&1; then
                echo "error: ${key} survived the strip in ${CONFIGURATION}" >&2
                exit 1
              fi
            done
          fi

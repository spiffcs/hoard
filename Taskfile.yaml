version: "3"

vars:
  # where binny installs the pinned toolchain
  TOOL_DIR: .tool

  # used for changelog generation
  CHANGELOG: CHANGELOG.md
  NEXT_VERSION: VERSION

tasks:
  ## High-level tasks #################################

  static-analysis:
    desc: Run all static analysis tasks
    cmds:
      - task: check-go-mod-tidy
      - task: lint

  test:
    desc: Run all levels of test
    cmds:
      - task: unit

  coverage:
    desc: Run unit tests with coverage and report the total
    cmds:
      # atomic rather than set: the browse and scan packages exercise
      # concurrent readers, and set mode races on the counters.
      - go test ./... -coverprofile=coverage.out -covermode=atomic
      - go tool cover -func=coverage.out | tail -1
      - 'echo "HTML report: go tool cover -html=coverage.out"'

  unit:
    desc: Run unit tests
    cmds:
      # No network needed: every HTTP client is pointed at an httptest server,
      # and the database is a temp-dir SQLite file.
      - go test ./...

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  build:
    desc: Build the hoard binary
    cmds:
      - go build -o hoard ./cmd/hoard

  # `all` used to build the hoard binary *and* a macOS scan helper. hoard now
  # talks to the phone itself, so the binary is the whole product and this is a
  # thin alias kept because the docs and muscle memory both use it.
  all:
    desc: Build the hoard binary
    cmds:
      - task: build

  clean:
    desc: Remove build output (binary, scan helper, release artifacts)
    cmds:
      - rm -rf hoard bin dist

  ## Bootstrap tasks #################################

  binny:
    internal: true
    # desc: Get the binny tool
    generates:
      - "{{ .TOOL_DIR }}/binny"
    status:
      - "test -f {{ .TOOL_DIR }}/binny"
    cmd: "curl -sSfL https://get.anchore.io/binny | sh -s -- -b .tool"
    silent: true

  tools:
    desc: Install all tools needed for CI and local development
    deps: [binny]
    aliases:
      - bootstrap
    generates:
      - ".binny.yaml"
      - "{{ .TOOL_DIR }}/*"
    status:
      - "{{ .TOOL_DIR }}/binny check -v"
    cmd: "{{ .TOOL_DIR }}/binny install -v"
    silent: true

  update-tools:
    desc: Update pinned versions of all tools to their latest available versions
    deps: [binny]
    generates:
      - ".binny.yaml"
      - "{{ .TOOL_DIR }}/*"
    cmd: "{{ .TOOL_DIR }}/binny update -v"
    silent: true

  list-tools:
    desc: List all tools needed for CI and local development
    deps: [binny]
    cmd: "{{ .TOOL_DIR }}/binny list"
    silent: true

  list-tool-updates:
    desc: List all tools that are not up to date relative to the binny config
    deps: [binny]
    cmd: "{{ .TOOL_DIR }}/binny list --updates"
    silent: true

  ## Static analysis tasks #################################

  format:
    desc: Auto-format all source code
    deps: [tools]
    cmds:
      - gofmt -w -s .
      - "{{ .TOOL_DIR }}/gosimports -local github.com/spiffcs -w ."
      - go mod tidy

  lint-fix:
    desc: Auto-format all source code + run golangci lint fixers
    deps: [tools]
    cmds:
      - task: format
      - "{{ .TOOL_DIR }}/golangci-lint run --tests=false --fix"

  lint:
    desc: Run gofmt + golangci lint checks
    vars:
      BAD_FMT_FILES:
        sh: gofmt -l -s .
      BAD_FILE_NAMES:
        sh: "find . | grep -e ':' || true"
    deps: [tools]
    cmds:
      # ensure there are no go fmt differences
      - cmd: 'test -z "{{ .BAD_FMT_FILES }}" || (echo "files with gofmt issues: [{{ .BAD_FMT_FILES }}]"; exit 1)'
        silent: true
      # ensure there are no files with ":" in it (a known back case in the go ecosystem)
      - cmd: 'test -z "{{ .BAD_FILE_NAMES }}" || (echo "files with bad names: [{{ .BAD_FILE_NAMES }}]"; exit 1)'
        silent: true
      # Lint BOTH platform views, not just the host's. golangci-lint only
      # analyzes the current GOOS, so a Mac never sees the linux build and
      # vice-versa — which is how three darwin-used symbols read as `unused`
      # on the linux CI runner while `make lint` on a Mac reported clean, and
      # rode through to a failed release. Running both here makes the target
      # match what CI (linux) enforces AND keep the darwin-only scanner code
      # linted, on whichever platform a developer runs it. windows shares the
      # !darwin view with linux, so the two GOOS below cover the build matrix.
      - "GOOS=darwin {{ .TOOL_DIR }}/golangci-lint run --tests=false"
      - "GOOS=linux {{ .TOOL_DIR }}/golangci-lint run --tests=false"

  check-go-mod-tidy:
    # desc: Ensure go.mod and go.sum are up to date
    cmds:
      - cmd: .github/scripts/go-mod-tidy-check.sh && echo "go.mod and go.sum are tidy!"
        silent: true

  ## Docs preview #################################

  # Render a Markdown file through GitHub's own /markdown endpoint and open it.
  # macOS-only for `open`, and never part of `all`: it needs the network and an
  # authenticated gh, so it is a thing you run while editing prose, not a gate.
  #
  #   make readme-preview                        # README.md
  #   task readme-preview -- CONTRIBUTING.md     # any other file
  #
  # The argument form is `task`: the make shim forwards only the target name, so
  # `make readme-preview -- CONTRIBUTING.md` quietly previews the README instead.
  readme-preview:
    desc: Preview a Markdown file as GitHub will render it (macOS)
    platforms: [darwin]
    cmd: ./scripts/readme-preview.sh {{ .CLI_ARGS }}

  ## Shipped images #################################
  #
  # macOS-only, both of them: sips, `open`, and headless Chrome. They are not
  # part of `all` and never run in CI — an image is checked by eye or not at
  # all, and these exist to make that cheap enough to actually do.

  # Open every shipped image at the size it is really seen, and say which ones
  # are older than the source they are generated from.
  asset-review:
    desc: Review every shipped image (macOS)
    platforms: [darwin]
    cmd: ./scripts/asset-review.sh

  # Headless Chrome exits 0 whether or not it did anything — a missing input file
  # and an unwritable output path both come back 0, measured. So the exit status
  # proves nothing here and the artifact is the only evidence: render to .tmp,
  # check what landed, and only then move it into docs/. Without that, a renamed
  # HTML file would print "Wrote ..." and leave the previous card in place, to be
  # committed and shipped as though it had been rebuilt.
  #
  # Chrome also writes "Trying to load the allocator multiple times" and some
  # task_policy_set lines to stderr on every run. Both are benign macOS noise,
  # and the output is byte-identical across runs; ignore them.
  social-preview:
    desc: Re-render the social preview card (macOS)
    platforms: [darwin]
    cmds:
      # Check the input, because Chrome will not. Handed a path that does not
      # exist it renders its own error page — at the requested size, as a valid
      # PNG, exit 0 — which passes every check made on the output alone. This is
      # the failure that actually happens, and it is caught here or not at all.
      - cmd: 'test -f docs/social-preview.html || (echo "social-preview: docs/social-preview.html is missing"; exit 1)'
        silent: true
      # Clear the staging file first, or a leftover from a previous run would
      # satisfy the checks below and certify a render that never happened.
      - mkdir -p .tmp && rm -f .tmp/social-preview.png
      - >-
        "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
        --headless --disable-gpu --hide-scrollbars --window-size=1280,640
        --screenshot=.tmp/social-preview.png docs/social-preview.html
      # Dimensions, because a wrong --window-size still produces a valid PNG that
      # GitHub would letterbox.
      - cmd: >-
          sips -g pixelWidth -g pixelHeight .tmp/social-preview.png 2>/dev/null |
          grep -q "pixelWidth: 1280" ||
          (echo "social-preview: not 1280 wide"; exit 1)
        silent: true
      # And weight, as a blank-render tripwire. The card is ~300KB of artwork and
      # gradient; anything Chrome renders when the page did not load is nearly
      # flat colour and compresses to a fraction of that (an error page measured
      # 17KB at the same dimensions). 100KB sits an order of magnitude clear of
      # the failure and well under the real thing.
      - cmd: 'test "$(stat -f %z .tmp/social-preview.png)" -gt 100000 || (echo "social-preview: render looks blank - did the page load?"; exit 1)'
        silent: true
      - mv .tmp/social-preview.png docs/assets/social-preview.png
      - cmd: echo "Wrote docs/assets/social-preview.png — upload it in Settings → General → Social preview"
        silent: true

  ## Native / scan tasks (hoard-only) #################################
  #
  # Every task in this group carries `platforms: [darwin]`: on the Linux CI
  # runner it is SKIPPED SILENTLY rather than failing, which is what makes a
  # single `task all` safe everywhere. The flip side: a green run on Linux
  # proves nothing about the Swift half. The real native gate is local
  # `make scan-test scan-check` plus the manual scan.yml workflow.
  #
  # There is no `scan` task any more. It built bin/hoard-scan.app, the Mac end
  # of the link to the phone; hoard now does that itself in internal/scan/link,
  # so the Swift here is the phone's code and the corpus harness only.

  # Replay the checked-in scan fixtures through the reader and diff the
  # extracted card lists against their goldens (macOS only). The reader is
  # cardkit-probe, so this depends on `cardkit` rather than `scan`.
  # Download the fixture frames the sweep replays. They are not in git — ~58MB
  # read by one macOS-only check that CI never runs, so carrying them charged
  # every contributor for a gate almost none of them would use. The goldens stay
  # tracked; only the inputs are fetched. Pinned by digest in scan/fixtures/frames.oci.
  scan-fixtures:
    desc: Download the scanner fixture frames (~58MB, once)
    platforms: [darwin]
    cmd: ./scripts/fetch-scan-fixtures.sh

  scan-check:
    desc: Replay scan fixtures against their goldens
    platforms: [darwin]
    deps: [cardkit, scan-fixtures]
    cmd: ./scan/fixtures/sweep.sh

  # Unit-test the Swift side's pure logic — the trigger state machine, the text
  # heuristics, the border reader's arithmetic, the wire contract. Complements
  # scan-check rather than replacing it: the sweep proves what the reader gets
  # off real frames, these prove the rules in isolation and run in milliseconds.
  scan-test:
    desc: Unit-test the Swift scan logic
    platforms: [darwin]
    cmd: swift test --package-path scan/hoard-scan

  # Build the iPhone head's read pipeline as a macOS binary, so it can be run
  # over an image file: it scores scan/corpus's labelled images and replays
  # scan/fixtures' frames against their goldens.
  cardkit:
    desc: Build cardkit-probe (bin/cardkit-probe)
    platforms: [darwin]
    cmds:
      - swift build -c release --package-path scan/hoard-scan --product cardkit-probe
      - mkdir -p bin
      - cp scan/hoard-scan/.build/release/cardkit-probe bin/cardkit-probe
      - cmd: echo "Built bin/cardkit-probe"
        silent: true

  # Score the corpus in one process: ~23s.
  #
  # There used to be a scan/corpus/sweep.sh beside this that scored the macOS
  # helper's own reader by launching one process per image. That reader belonged
  # to the Continuity Camera path and went with it; the script went too, and this
  # is now the only corpus scorer. Launching 231 processes rather than reading 231
  # cards had made the one loop guarding against accuracy regressions the slowest
  # loop in the project — slow enough to be skipped, which is the same as not
  # having it.
  #
  #   task cardkit-score                   # the table
  #   task cardkit-score -- --misses       # and every card that failed
  #
  # `make cardkit-score ARGS=--misses` still works: make exports command-line
  # variables into the recipe environment, and ${ARGS:-} picks them up there.
  cardkit-score:
    desc: Score the labelled corpus in one process (~23s)
    platforms: [darwin]
    deps: [cardkit]
    cmd: ./bin/cardkit-probe --score scan/corpus/manifest.tsv {{ .CLI_ARGS }} ${ARGS:-}

  # Everything derived from the logo, from the one file that is the logo.
  #
  # docs/assets/logo-master.png is the source of truth and the only hand-authored
  # image here, and the README's copy is generated from it. It is a tracked PNG —
  # a stale one is simply committed, because nothing downstream notices — so
  # `make asset-review` reports its freshness.
  #
  # The iPhone icon used to be generated from this master too, and is not any
  # more: it is now hand-authored, full-bleed artwork committed directly at
  # scan/hoard-scan-ios/Resources/Assets.xcassets/AppIcon.appiconset/icon-1024.png.
  # The generator assumed artwork floating on transparency and found the mark by
  # its alpha bounding box; a finished icon is opaque edge to edge, so that box
  # is the whole image and the composition came back shrunk to 82% and
  # letterboxed (measured). The two faces can now drift, which is the price of
  # the phone wearing a design the README cannot use.
  #
  # Not a dependency of scan-ios: a build should not quietly rewrite tracked
  # assets, and these are meant to be looked at before they are committed.
  logo:
    desc: Rebuild the README logo from the master artwork
    platforms: [darwin]
    cmds:
      # Staged and checked for the same reason the card is: `sips` exits 0 when
      # its input does not exist (measured — it only reports a failure it cannot
      # write, exit 13). A renamed master would otherwise leave the old copy in
      # docs/ and report success.
      - mkdir -p .tmp && rm -f .tmp/hoard-logo.png
      # 640px serves both consumers with headroom — the README shows it at 190,
      # the social card at 420 — while the master stays full size for the icon,
      # which needs 840px of artwork on its long side and may want more later.
      - sips --resampleWidth 640 docs/assets/logo-master.png --out .tmp/hoard-logo.png >/dev/null
      - cmd: 'test -s .tmp/hoard-logo.png || (echo "logo: sips wrote nothing - is docs/assets/logo-master.png there?"; exit 1)'
        silent: true
      - mv .tmp/hoard-logo.png docs/assets/hoard-logo.png
      - cmd: echo "Wrote docs/assets/hoard-logo.png — rerun 'make social-preview' if the card should follow"
        silent: true

  # Build the iPhone capture head. Needs xcodegen, the iOS platform payload
  # (xcodebuild -downloadPlatform iOS) and a signing team — scripts/build-scan-ios.sh
  # reports whichever is missing. See scan/hoard-scan-ios/README.md.
  scan-ios:
    desc: Build the iPhone capture head
    platforms: [darwin]
    cmd: ./scripts/build-scan-ios.sh

  # Same, then install onto an attached, unlocked iPhone with Developer Mode on.
  scan-ios-install:
    desc: Build and install the iPhone capture head onto an attached iPhone
    platforms: [darwin]
    cmd: ./scripts/build-scan-ios.sh --install

  # The distribution path for the same app: Release archive + signed .ipa.
  #
  # Split into three targets rather than one with a flag, matching how
  # scan-ios/scan-ios-install already split — and here the split is also a
  # safety property. `scan-ios-release` never talks to Apple, so it is the one
  # to run while iterating; `-validate` runs Apple's pre-upload checks without
  # spending a build number; `-upload` is the irreversible one, because a build
  # number that has been uploaded can never be reused.
  #
  # The archive stops short of a signed export until the bundle ID is
  # registered and the team has an Apple Distribution certificate, and the
  # upload needs App Store Connect credentials that no tracked file holds.
  # scripts/release-scan-ios.sh reports whichever is missing, in the same shape
  # scripts/build-scan-ios.sh reports a signing failure. See docs/specs/app-store-release.md.
  scan-ios-release:
    desc: Archive and export the iPhone capture head for App Store Connect
    platforms: [darwin]
    cmd: ./scripts/release-scan-ios.sh

  scan-ios-release-validate:
    desc: Archive, export, and run App Store Connect's pre-upload validation
    platforms: [darwin]
    cmd: ./scripts/release-scan-ios.sh --validate

  scan-ios-release-upload:
    desc: Archive, export, and upload the iPhone capture head to App Store Connect
    platforms: [darwin]
    cmd: ./scripts/release-scan-ios.sh --upload

  # Run the package's unit tests on the iOS simulator. They are Vision-free and
  # CoreGraphics-only, so they prove the phone's targets still compile and
  # behave for iOS without needing a device or a signing identity. This is the
  # cheap gate; the expensive one is the on-device fixture replay in the app
  # itself, because simulator Vision is not device Vision and goldens must never
  # come from it.
  #
  # hoard-scan-Package is SwiftPM's generated all-targets scheme, which is what
  # carries a test action across every target at once. The simulator is
  # discovered rather than named, because the installed runtime's device list
  # changes with every Xcode update and a hardcoded model goes stale silently.
  # The Makefile used $(shell ...) at parse time; this var uses `sh:`, which is
  # evaluated lazily — so xcrun never runs on Linux.
  scan-ios-test:
    desc: Run the scan package's unit tests on the iOS simulator
    platforms: [darwin]
    vars:
      # `$` needs no escaping here. A Taskfile is not a Makefile: `sh:` hands the
      # string to the shell as written, so the `$$` this used to carry became the
      # shell's own PID and `sed 's/ *<pid>//'` stripped nothing. The name kept
      # its trailing space, no destination matched it, and the task failed with
      # exit 70 and a list of the very simulator it had just asked for.
      SIM_NAME:
        sh: "xcrun simctl list devices available | grep -m1 -o 'iPhone [A-Za-z0-9 ]*' | sed 's/ *$//'"
    cmd: >
      cd scan/hoard-scan && xcodebuild test -scheme hoard-scan-Package
      -destination 'platform=iOS Simulator,name={{ .SIM_NAME }}' CODE_SIGNING_ALLOWED=NO

  ## Schema tasks #################################

  # Regenerate schema/json/ from the internal/hoardjson model. If the current
  # schema version has been released, bump hoardjson.SchemaVersion first.
  generate-json-schema:
    desc: Regenerate schema/json/ from the internal/hoardjson model
    cmd: go run ./schema/json/generate

  # Regenerate schema/sqlite/ from the migrations in internal/store/migrate.go.
  # Run after adding a migration; released schema files are immutable, so a new
  # migration writes a new file rather than editing an old one.
  generate-sqlite-schema:
    desc: Regenerate schema/sqlite/ from the store migrations
    cmd: go run ./schema/sqlite/generate

  # Regenerate internal/demo/history.json — the ninety days of prices
  # `hoard demo` seeds so its movers view is populated without a download.
  # Reaches MTGJSON, and freezes at the moment it runs: re-run it whenever
  # collection.json is regenerated, and before a release, or the demo opens
  # movers on a series that has aged out of the window it is asked for.
  generate-demo-history:
    desc: Regenerate the sample collection's price history from a live backfill
    cmd: go run ./internal/demo/gen internal/demo/history.json

  ## Changelog tasks #################################

  unreleased:
    desc: Show unreleased changes since the latest tag
    deps: [tools]
    cmds:
      - "{{ .TOOL_DIR }}/chronicle -n --since-tag {{ .LATEST_TAG }} | {{ .TOOL_DIR }}/glow -w 0"
    vars:
      LATEST_TAG:
        sh: git describe --tags --abbrev=0

  changelog:
    desc: Generate a changelog
    deps: [tools]
    generates:
      - "{{ .CHANGELOG }}"
      - "{{ .NEXT_VERSION }}"
    cmds:
      - "{{ .TOOL_DIR }}/chronicle -vv -n --version-file {{ .NEXT_VERSION }} > {{ .CHANGELOG }}"
      - "{{ .TOOL_DIR }}/glow -w 0 {{ .CHANGELOG }}"

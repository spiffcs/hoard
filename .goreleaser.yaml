version: 2

project_name: hoard

before:
  hooks:
    - mkdir -p completions
    - sh -c "go run ./cmd/hoard completion bash > completions/hoard.bash"
    - sh -c "go run ./cmd/hoard completion zsh > completions/_hoard"
    - sh -c "go run ./cmd/hoard completion fish > completions/hoard.fish"
    - sh -c "SOURCE_DATE_EPOCH={{ .CommitTimestamp }} go run ./internal/tools/genman manpages"

builds:
  - id: hoard-linux
    binary: hoard
    main: ./cmd/hoard
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    goos: [linux]
    goarch: [amd64, arm64]
    ldflags: &ldflags
      - -s -w
      - -X github.com/spiffcs/hoard/internal/buildinfo.Version={{ .Version }}
      - -X github.com/spiffcs/hoard/internal/buildinfo.GitCommit={{ .Commit }}
      - -X github.com/spiffcs/hoard/internal/buildinfo.BuildDate={{ .Date }}

  - id: hoard-darwin
    binary: hoard
    main: ./cmd/hoard
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    goos: [darwin]
    goarch: [amd64, arm64]
    ldflags: *ldflags
    hooks:
      post:
        - cmd: .tool/quill sign-and-notarize "{{ .Path }}" --dry-run={{ .IsSnapshot }} --ad-hoc={{ .IsSnapshot }} -vv
          env:
            - QUILL_LOG_FILE=/tmp/quill-{{ .Target }}.log

archives:
  - id: default
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE
      - NOTICE
      - src: completions/*
        dst: completions
        info: {mode: 0644}
      - src: manpages/*
        dst: manpages
        info: {mode: 0644}

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

sboms:
  - id: archive
    artifacts: archive
    cmd: ../.tool/syft
    args: ["$artifact", "--output", "spdx-json=$document"]
    documents:
      - "{{ .ArtifactName }}.sbom.json"

snapshot:
  version_template: "{{ incpatch .Version }}-next+{{ .ShortCommit }}"

changelog:
  sort: asc
  abbrev: 7
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Other changes
      order: 999
  filters:
    exclude:
      - "^docs:"
      - "^docs\\("
      - "^test:"
      - "^chore:"
      - "^style:"
      - "^Merge pull request"
      - "^Merge branch"

signs:
  - cmd: .tool/cosign
    signature: "${artifact}.sigstore.json"
    args: ["sign-blob", "--bundle=${signature}", "--yes", "${artifact}"]
    artifacts: checksum

release:
  github:
    owner: spiffcs
    name: hoard
  draft: false
  prerelease: auto
  make_latest: true
  footer: |
    ---
    **Verification:**
    ```bash
    cosign verify-blob \
        --bundle checksums.txt.sigstore.json \
        --certificate-identity-regexp "^https://github.com/spiffcs/hoard/.*" \
        --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
        checksums.txt
    ```
